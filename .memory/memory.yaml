  - text: "Bug: CRLF normalization — git autocrlf=true + .editorconfig CRLF menyebabkan file yang di-write dengan LF oleh tool di-revert saat checkout. Fix: checkout HEAD -- <files> untuk restore. Root cause: file harus ditulis dengan CRLF line endings agar match dengan autocrlf conversion."
    tags: [bug, environment]
    count: 1
